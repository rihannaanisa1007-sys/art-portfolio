<!doctype html>
<html>

    <head>

        <meta charset="utf-8">
        <title> Art Portfolio</title>
        <link rel="icon" type="image/x-icon" href="https://pngimg.com/uploads/cat/cat_PNG50525.png">
        <style>
            .box{
                display: grid;
				grid-template-columns: 300px 200px 300px;
                grid-template-rows: 100px 100px;
                gap: 10px;
                background-color: #8496f0;
                border: 2px solid #636fad;
                padding: 10px;
                margin: 20px auto;
				max-width: 840px;

                
                }

            .box > div {
                    background: white;
                    border: 1px solid #ffffff;
                }

                
            ul {
  				list-style-type: none;
 				margin: 0;
				padding: 0;
  				overflow: hidden;
  				background-color: #b3cfff;
			}

			ul li {
  				float: left;
			}

			ul li a {
  				display: block;
  				color: rgb(40, 51, 91);
  				text-align: center;
  				padding: 14px 16px;
  				text-decoration: none;
			}
            
            ul li a:hover {
  				background-color: rgb(40, 51, 91);
                color: white;
			}


        </style>
    </head>

    <body>
        <div>
            <ul>
                <li><a href="Index.html">Home</a></li>
            </ul>
        </div>

        <div class="box">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </body>
</html>
